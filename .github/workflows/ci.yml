name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify TLA+ Models (TLC)
        run: |
          ./scripts/tlc.sh | tee tlc.log
          ! grep -E "Error:|violated" tlc.log
      - name: Maven Verify (Unit, Property, Modulith & ArchUnit)
        run: ./mvnw -B verify
      - name: Generate CycloneDX SBOM
        run: ./mvnw -B package -Psbom -DskipTests

