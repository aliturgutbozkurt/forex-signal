name: tla
on:
  pull_request:
    paths: ["docs/tla/**", "scripts/tlc.sh"]
  push:
    branches: [main]
    paths: ["docs/tla/**"]
jobs:
  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25" }
      - name: Model check all TLA+ specs
        run: |
          ./scripts/tlc.sh | tee tlc.log
          ! grep -E "Error:|violated" tlc.log
